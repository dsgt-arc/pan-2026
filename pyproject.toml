[project]
name = "pan"
version = "0.1.1"
authors = [{ name = "Harshul Basava", email = "harshul@gatech.edu" }]
description = "DS@GT CLEF pan repository"
readme = "README.md"
requires-python = ">=3.8"
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/dsgt-arc/pan-2026"
Issues = "https://github.com/dsgt-arc/pan-2026/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = { file = "requirements.txt" }

[tool.setuptools.packages.find]
where = ["."]
include = []
namespaces = false
